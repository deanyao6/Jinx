name: Daily data jobs

on:
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC, after nflverse and MLB overnight updates
  workflow_dispatch:

jobs:
  mlb-and-elo:
    name: MLB pending details and Elo
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Current MLB season schedule refresh
        run: npx tsx ingest/src/mlb/backfill.ts --from $(date +%Y) --to $(date +%Y) --force
      # The favourite-player picker shows each team's real roster (team_rosters), so a trade
      # or a call-up shows up the next morning. 30 requests, one per team.
      - name: MLB current rosters
        run: npx tsx ingest/src/mlb/rosters.ts
      # Famous games: superstars, debuts and joins for the personal badges, then the curated
      # list and the championship rows. Each refreshes every cached stats payload at the end.
      - name: MLB honors (award winners and All-Stars, this season and the three before)
        run: npx tsx ingest/src/mlb/honors.ts
      - name: MLB debut dates for players without one
        run: npx tsx ingest/src/mlb/debuts.ts
      - name: MLB joins (trades and signings, last 30 days)
        run: npx tsx ingest/src/mlb/moves.ts
      - name: Famous games (curated list and championship rows)
        run: npx tsx ingest/src/famous/curated.ts
      - name: Franchise players (seed/franchise_players.json)
        run: npx tsx ingest/src/famous/franchise.ts
      - name: MLB details for attended games lacking detail
        run: npx tsx ingest/src/mlb/detail.ts --pending --limit 300
      - name: Elo (MLB)
        run: npx tsx ingest/src/elo/run.ts --sport mlb
      - name: Elo (NFL)
        run: npx tsx ingest/src/elo/run.ts --sport nfl
      # The NBA: the current season's schedule from the CDN (times, arenas, finals), rosters for
      # the picker, detail for logged games lacking it, then Elo. The scheduled path is the
      # nba-sync Edge Function every 15 minutes; this is the net under it.
      - name: NBA current season schedule refresh
        run: npx tsx ingest/src/nba/backfill.ts --from $(date +%Y) --to $(date +%Y) --force
      # stats.nba.com does not answer GitHub's runners (docs/verification.md, 2026-09-18):
      # rosters and pre-2019 detail fail here and are run from a laptop instead. The failure
      # is allowed so Elo and Relive below still run.
      - name: NBA current rosters
        continue-on-error: true
        run: npx tsx ingest/src/nba/rosters.ts
      - name: NBA details for attended games lacking detail
        continue-on-error: true
        run: npx tsx ingest/src/nba/detail.ts --pending --limit 300
      - name: Elo (NBA)
        run: npx tsx ingest/src/elo/run.ts --sport nba
      # Last, so a failure here can never cost the Elo run that Pick a side depends on.
      # The scheduled path is the mlb-sync Edge Function, every 15 minutes. This is the net under
      # it: if pg_cron or the function is down, stories still land within a day.
      - name: MLB Relive stories for attended games
        run: npx tsx ingest/src/mlb/relive.ts --attended
      - name: NBA Relive stories for attended games
        run: npx tsx ingest/src/nba/relive.ts --attended
